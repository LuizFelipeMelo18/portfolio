<section class="contact-box">
  <h3 class="contact-box__title">{{ title() }}</h3>

  <a class="contact-box__email" [href]="mailtoHref()">
    <svg class="contact-box__icon" viewBox="0 0 24 18" aria-hidden="true">
      <path d="M1 1h22v16H1z" />
      <path d="M1 1l11 9 11-9" />
    </svg>
    <span>{{ email() }}</span>
  </a>
</section>
